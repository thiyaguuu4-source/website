apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-website
  labels:
    app: analytics-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics-website
  template:
    metadata:
      labels:
        app: analytics-website
    spec:
      containers:
      - name: website
        image: thiyagup/analytics-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
spec:
  type: NodePort
  selector:
    app: analytics-website
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30008
